name: Facebook Marketplace Monitor

on:
  schedule:
    # Every 15 minutes, but only 08:00-23:59 Belgium time (CEST = UTC+2) ->
    # 06:00-21:45 UTC. No runs at all between local midnight and 08:00.
    #
    # ⚠️ Cron here is fixed in UTC and does NOT follow daylight saving time.
    # Belgium switches to CET (UTC+1) in late October - shift both hour
    # bounds below by -1 (e.g. "5-20") after that, and back by +1 in spring,
    # if you want the same *local* 08:00-00:00 window year-round.
    #
    # Each run calls the configured scraper_provider (Apify or Bright Data),
    # which costs money - this schedule runs ~64 times/day (16h x 4/hour).
    - cron: "*/15 6-21 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

# Needed to let the "persist state" step below commit and push
# seen_listings.json / last_scan.json back to the repository.
permissions:
  contents: write

concurrency:
  # Prevents two scans from running at once (e.g. a scheduled run overlapping
  # with a manual workflow_dispatch run) - a second run would read a stale
  # seen_listings.json and could double-notify.
  group: facebook-car-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one monitoring cycle
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
        run: python main.py
        # RUN_ONCE is not set here on purpose: main.py auto-detects the
        # GITHUB_ACTIONS environment variable (set by GitHub itself) and
        # runs exactly one cycle, then exits with the process's real exit
        # code (0 success / 1 failure) so this step - and the whole job -
        # is correctly reported as failed if the scan failed.

      - name: Persist seen_listings.json / last_scan.json
        if: always()
        run: |
          git config user.name "facebook-car-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_listings.json last_scan.json
          git diff --cached --quiet || git commit -m "chore: update monitor state [skip ci]"
          git push
